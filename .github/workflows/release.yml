name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    name: Linux (AppImage / deb / pacman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install libarchive (pacman needs bsdtar)
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm run test
      - run: npm run dist -- --publish never
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/jazz-note-linux-*.AppImage
            dist/jazz-note-linux-*.deb
            dist/jazz-note-linux-*.pacman

  release-win:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run dist -- --publish never
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/jazz-note-win-*.exe

  release-server:
    name: Server bundle (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - name: Assemble server bundle
        run: |
          mkdir -p stage
          cp web/dist-server/server.js stage/server.js
          cp web/dist-server/node-sqlite3-wasm.wasm stage/node-sqlite3-wasm.wasm
          cp -r web/dist stage/dist
          cp deploy/install.sh stage/install.sh
          cp deploy/jazz-note-server.service stage/jazz-note-server.service
          cp deploy/README-server.md stage/README-server.md
          node -e 'const fs=require("fs");fs.writeFileSync("stage/package.json",JSON.stringify({name:"jazz-note-server",version:process.env.GITHUB_REF_NAME,main:"server.js",scripts:{start:"node server.js"}},null,2)+"\n")'
          chmod +x stage/install.sh
          tar -czf "jazz-note-server-${GITHUB_REF_NAME}.tar.gz" -C stage .
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: jazz-note-server-*.tar.gz
